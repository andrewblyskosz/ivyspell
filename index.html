<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ivy's Hop 'N Spell</title>
  <style>
    @font-face {
      font-family: 'OkrienHmkBold';
      src: url('OkrienHmkBold.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'SAKUNA';
      src: url('SAKUNA.otf') format('opentype'),
           url('SAKUNA.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #c97a50;
    }

    /* ─── LANDSCAPE LAYOUT ─── */
    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .bg-landscape {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Portrait bg – hidden on wide screens */
    .bg-portrait {
      display: none;
    }

    /* ─── TITLE BLOCK ─── */
    .title-block {
      position: absolute;
      top: 8%;
      right: 5%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      pointer-events: none;
      user-select: none;
    }

    /* "Ivy's" */
    .title-ivys {
      font-family: 'OkrienHmkBold', cursive;
      font-size: clamp(2.8rem, 6vw, 7rem);
      color: #c96fdb;
      /* layered text-shadow to simulate a thick dark outline */
      -webkit-text-stroke: 0px transparent;
      paint-order: stroke fill;
      text-shadow:
        /* dark purple/maroon outline */
        -3px -3px 0 #3a0a4a,
         3px -3px 0 #3a0a4a,
        -3px  3px 0 #3a0a4a,
         3px  3px 0 #3a0a4a,
        -4px  0   0 #3a0a4a,
         4px  0   0 #3a0a4a,
         0   -4px 0 #3a0a4a,
         0    4px 0 #3a0a4a,
        /* softer second layer */
        -5px -5px 0 #3a0a4a,
         5px -5px 0 #3a0a4a,
        -5px  5px 0 #3a0a4a,
         5px  5px 0 #3a0a4a;
      line-height: 1;
      letter-spacing: 0.02em;
    }

    /* "HOP 'N SPELL" */
    .title-hop {
      font-family: 'SAKUNA', sans-serif;
      font-size: clamp(3.5rem, 8.5vw, 10.5rem);
      color: #29b8c9;
      paint-order: stroke fill;
      text-shadow:
        /* dark teal outline */
        -4px -4px 0 #0a4050,
         4px -4px 0 #0a4050,
        -4px  4px 0 #0a4050,
         4px  4px 0 #0a4050,
        -5px  0   0 #0a4050,
         5px  0   0 #0a4050,
         0   -5px 0 #0a4050,
         0    5px 0 #0a4050,
        -6px -6px 0 #0a4050,
         6px -6px 0 #0a4050,
        -6px  6px 0 #0a4050,
         6px  6px 0 #0a4050;
      line-height: 1;
      letter-spacing: 0.03em;
      margin-top: -0.05em;
    }

    /* ─── PORTRAIT LAYOUT ─── */
    @media (orientation: portrait), (max-aspect-ratio: 3/4) {
      .bg-landscape {
        display: none;
      }
      .bg-portrait {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
      }

      .title-block {
        top: auto;
        bottom: 12%;
        right: 50%;
        transform: translateX(50%);
        width: 90%;
        text-align: center;
        align-items: center;
      }

      .title-ivys {
        font-size: clamp(2.8rem, 11vw, 6rem);
      }

      .title-hop {
        font-size: clamp(3.2rem, 13vw, 8rem);
      }
    }
  </style>
</head>
<body>
  <div class="scene">

    <!-- Background images -->
    <img class="bg-landscape" src="IVY-WORD-SPELL_LANDSCAPE.jpg" alt="" />
    <img class="bg-portrait"  src="IVY-WORD-SPELL_PORTRAIT.jpg"  alt="" />

    <!-- Title overlay -->
    <div class="title-block">
      <span class="title-ivys">Ivy's</span>
      <span class="title-hop">HOP 'N SPELL</span>
    </div>

  </div>
</body>
</html>
