#app{
  position:relative;z-index:1;
  display:none;
  flex-direction:column;align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:20px 24px;
  opacity:0;
  transition:opacity 0.4s ease;
}

/* ── CARD ── */
.card{
  background:rgba(8,8,30,0.88);
  border:2px solid rgba(255,45,120,.4);
  border-radius:16px;
  padding:20px 26px;
  width:100%;max-width:780px;
  box-shadow:0 0 60px rgba(255,45,120,.15),0 0 120px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.5);
  position:relative;overflow:hidden;
  backdrop-filter:blur(6px);
}
.card::before{
  content:'';position:absolute;inset:0;border-radius:20px;
  background:linear-gradient(135deg,rgba(255,45,120,.07),transparent 50%,rgba(0,245,255,.04));
  pointer-events:none;
}

/* ── FILE BADGES ── */
.file-row{display:flex;gap:6px;margin-bottom:10px;position:relative;z-index:1;}
.badge{
  display:flex;align-items:center;gap:5px;
  font-family:'Nunito',sans-serif;font-size:.68rem;font-weight:900;
  letter-spacing:.5px;text-transform:uppercase;
  padding:5px 8px;border-radius:7px;border:none;
  cursor:pointer;transition:transform .12s,box-shadow .15s;
  flex:1;justify-content:center;
}
.badge:active{transform:scale(.95);}
.badge-save{background:rgba(0,245,255,.08);border:1.5px solid rgba(0,245,255,.4);color:#00F5FF;}
.badge-save:hover{background:rgba(0,245,255,.16);box-shadow:0 0 16px rgba(0,245,255,.3);}
.badge-load{background:rgba(255,215,0,.07);border:1.5px solid rgba(255,215,0,.4);color:#FFD700;}
.badge-load:hover{background:rgba(255,215,0,.15);box-shadow:0 0 16px rgba(255,215,0,.3);}

/* ── WORD GRID ── */
.words-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px;position:relative;z-index:1;}
.word-wrap{position:relative;}
.word-num{position:absolute;top:50%;left:5px;transform:translateY(-50%);font-size:.5rem;font-weight:900;color:rgba(255,45,120,.6);z-index:1;pointer-events:none;}
.word-input{
  background:rgba(255,255,255,.05);border:1.5px solid rgba(255,45,120,.3);
  border-radius:6px;color:#fff;
  font-family:'Nunito',sans-serif;font-size:.65rem;font-weight:700;
  padding:3px 2px 3px 12px;outline:none;width:100%;
  transition:border-color .2s,box-shadow .2s;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.word-input::placeholder{color:rgba(255,255,255,.2);font-size:.75rem;}
.word-input:focus{border-color:#FF2D78;box-shadow:0 0 10px rgba(255,45,120,.3);}

/* ── PROGRESS / STATS ── */
.stats-row{display:flex;align-items:center;gap:16px;margin-bottom:14px;position:relative;z-index:1;}
.progress-bg{flex:1;background:rgba(255,255,255,.08);border-radius:100px;height:6px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#FF2D78,#FFD700);border-radius:100px;transition:width .5s ease;box-shadow:0 0 10px rgba(255,45,120,.6);}
.word-counter{font-family:'Bangers',cursive;font-size:1.1rem;letter-spacing:3px;color:#FFD700;filter:drop-shadow(0 0 8px rgba(255,215,0,.4));white-space:nowrap;}
.tries-row{display:flex;align-items:center;gap:6px;white-space:nowrap;}
.try-dot{width:10px;height:10px;border-radius:50%;border:2px solid;}
.try-dot.on{background:#FFD700;border-color:#FFD700;box-shadow:0 0 8px #FFD700;}
.try-dot.off{background:transparent;border-color:rgba(255,255,255,.2);}
.try-label{font-size:.65rem;font-weight:800;letter-spacing:1.5px;color:rgba(255,255,255,.35);text-transform:uppercase;margin-left:3px;}

/* ── BUTTONS ── */
.btn{font-family:'Bangers',cursive;letter-spacing:2px;border:none;border-radius:10px;cursor:pointer;transition:transform .12s,box-shadow .15s;}
.btn:active{transform:scale(.95)!important;}
.btn-start{background:linear-gradient(135deg,#FF2D78,#FF6B00);color:#fff;font-size:1rem;padding:8px 20px;width:100%;box-shadow:0 4px 28px rgba(255,45,120,.5);position:relative;z-index:1;}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 6px 36px rgba(255,45,120,.7);}
.btn-speak{background:linear-gradient(135deg,#7B2FFF,#00C4DD);color:#fff;font-size:1rem;padding:12px 28px;box-shadow:0 4px 20px rgba(123,47,255,.4);width:auto;display:inline-flex;align-items:center;gap:8px;}
.btn-speak:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(0,245,255,.5);}
.btn-speak.pulsing{animation:speak-pulse .55s ease-in-out infinite alternate;}
@keyframes speak-pulse{from{box-shadow:0 4px 20px rgba(0,245,255,.3);}to{box-shadow:0 4px 42px rgba(0,245,255,.75);transform:scale(1.02);}}
.btn-submit{background:linear-gradient(135deg,#FF2D78,#7B2FFF);color:#fff;font-size:1rem;padding:11px 8px;flex:1.5;box-shadow:0 4px 20px rgba(123,47,255,.35);display:flex;align-items:center;justify-content:center;gap:0px;}
.btn-submit:hover{transform:translateY(-2px);}
.btn-submit:disabled{opacity:.4;cursor:default;transform:none!important;}
.btn-replay{background:linear-gradient(135deg,#FF2D78,#FF6B00);color:#fff;font-size:1.15rem;padding:12px 0;flex:1;box-shadow:0 4px 24px rgba(255,45,120,.45);}
.btn-replay:hover{transform:translateY(-2px);}
.btn-secondary{background:rgba(255,255,255,.07);color:rgba(255,255,255,.55);border:1.5px solid rgba(255,255,255,.15);font-size:.82rem;padding:12px 16px;}
.btn-secondary:hover{background:rgba(255,255,255,.12);}
.btn-row{display:flex;gap:8px;position:relative;z-index:1;margin-top:16px;}

/* ── SPEAK ── */
.speak-section{text-align:center;margin-bottom:14px;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;}
.speak-hint{font-size:.68rem;font-weight:800;letter-spacing:2px;color:rgba(255,255,255,.3);text-transform:uppercase;margin-bottom:10px;}

/* ── ANSWER INPUT ── */
.answer-input{
  background:rgba(255,255,255,.05);border:2px solid rgba(255,45,120,.45);
  border-radius:12px;color:#fff;
  font-family:'Nunito',sans-serif;font-size:1.4rem;font-weight:900;
  padding:14px 18px;outline:none;width:100%;
  text-align:center;letter-spacing:6px;
  transition:border-color .2s,box-shadow .2s;
  margin-bottom:10px;position:relative;z-index:1;
}
.answer-input:focus{border-color:#FF2D78;box-shadow:0 0 20px rgba(255,45,120,.3);}
.answer-input:disabled{opacity:.4;}

/* ── FEEDBACK OVERLAY ── */
.overlay{
  position:absolute;inset:0;border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:20;gap:10px;
  animation:ov-in .28s cubic-bezier(.34,1.56,.64,1);
}
@keyframes ov-in{from{opacity:0;transform:scale(.75);}to{opacity:1;transform:scale(1);}}
.ov-correct{background:rgba(0,18,10,.96);border:2.5px solid #00FF88;}
.ov-try{background:rgba(22,10,0,.96);border:2.5px solid #FF8C00;}
.ov-wrong{background:rgba(20,0,0,.88);border:1.5px solid rgba(160,40,40,.5);animation:ov-in .3s ease-out;}

.ov-big{font-family:'Bangers',cursive;letter-spacing:5px;text-align:center;line-height:1;}
.ov-correct .ov-big{font-size:4rem;background:linear-gradient(135deg,#FF2D78,#FF6B00,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 28px rgba(0,255,136,.5));animation:pop .4s cubic-bezier(.34,1.56,.64,1);}
.ov-try .ov-big{font-size:3rem;color:#FF8C00;filter:drop-shadow(0 0 18px rgba(255,140,0,.5));}
.ov-wrong .ov-big{font-size:2.2rem;color:#CC4444;filter:drop-shadow(0 0 8px rgba(160,40,40,.3));}
@keyframes pop{from{transform:scale(0);}to{transform:scale(1);}}

.ov-sub{font-size:.95rem;font-weight:800;color:rgba(255,255,255,.65);letter-spacing:1px;text-align:center;}
.ov-reveal{font-family:'Nunito',sans-serif;font-size:1.3rem;font-weight:900;letter-spacing:2px;color:#FFD700;}

/* ── RESULTS ── */
.results-top{display:flex;align-items:center;gap:22px;margin-bottom:14px;position:relative;z-index:1;}
.score-ring{
  width:120px;height:120px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:0 0 40px rgba(0,255,136,.28);
}
.score-ring::after{content:'';position:absolute;inset:12px;border-radius:50%;background:rgba(8,8,30,.95);}
.score-num{font-family:'Bangers',cursive;font-size:2rem;letter-spacing:2px;color:#FFD700;z-index:1;filter:drop-shadow(0 0 10px rgba(255,215,0,.4));}
.verdict-block{display:flex;flex-direction:column;gap:6px;}
.stars-row{font-size:1.6rem;}
.verdict{font-family:'Bangers',cursive;font-size:1.3rem;letter-spacing:2px;}
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-height:160px;overflow-y:auto;position:relative;z-index:1;margin-bottom:4px;}
.result-grid::-webkit-scrollbar{width:4px;}
.result-grid::-webkit-scrollbar-thumb{background:rgba(255,45,120,.4);border-radius:100px;}
.card::-webkit-scrollbar{width:5px;}
.card::-webkit-scrollbar-thumb{background:rgba(255,45,120,.3);border-radius:100px;}
.card::-webkit-scrollbar-track{background:transparent;}
.ri{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;font-weight:800;font-size:.78rem;}
.ri-y{background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.25);color:#00FF88;}
.ri-n{background:rgba(255,50,50,.08);border:1px solid rgba(255,50,50,.25);color:#FF6666;}
.results-btns{display:flex;gap:10px;margin-top:14px;position:relative;z-index:1;}

/* ── CHARACTER GLOW REACT ── */
#bg-glow{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  opacity:0;transition:opacity 0.15s ease;
  border-radius:0;
}
#bg-glow.glow-correct{
  background:radial-gradient(ellipse at 20% 60%, rgba(0,255,120,.28) 0%, transparent 55%),
             radial-gradient(ellipse at 20% 60%, rgba(0,200,80,.15) 0%, transparent 70%);
  animation:bg-pulse-correct 1.8s ease-out forwards;
}
#bg-glow.glow-wrong{
  background:radial-gradient(ellipse at 20% 60%, rgba(255,40,40,.18) 0%, transparent 55%);
  animation:bg-pulse-wrong 1.2s ease-out forwards;
}
@keyframes bg-pulse-correct{
  0%  {opacity:0;}
  15% {opacity:1;}
  60% {opacity:.7;}
  100%{opacity:0;}
}
@keyframes bg-pulse-wrong{
  0%  {opacity:0;}
  20% {opacity:1;}
  100%{opacity:0;}
}
.flash{position:fixed;inset:0;pointer-events:none;z-index:200;animation:flash-out .35s ease-out forwards;}
.flash-gold{background:rgba(255,215,0,.38);}
.flash-red{background:rgba(255,45,45,.38);}
@keyframes flash-out{0%{opacity:1;}100%{opacity:0;}}

/* ── PARTICLES ── */
.particle{position:fixed;top:50%;left:50%;border-radius:50%;pointer-events:none;z-index:300;animation:p-fly var(--dur) ease-out forwards;}
@keyframes p-fly{0%{transform:translate(-50%,-50%) scale(1);opacity:1;}100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(0);opacity:0;}}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
  padding:12px 26px;border-radius:40px;
  font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:900;
  letter-spacing:.5px;white-space:nowrap;z-index:500;
  display:flex;align-items:center;gap:9px;
  animation:toast-in .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;
}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(14px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.toast-success{background:rgba(0,20,12,.97);border:1.5px solid #00FF88;color:#00FF88;box-shadow:0 0 20px rgba(0,255,136,.35);}
.toast-error{background:rgba(28,0,0,.97);border:1.5px solid #FF5555;color:#FF5555;box-shadow:0 0 20px rgba(255,80,80,.35);}

/* ── ICON BUTTONS ── */
.icon-btn{
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);
  color:rgba(255,255,255,.6);border-radius:7px;
  font-family:'Nunito',sans-serif;font-size:.65rem;font-weight:900;
  letter-spacing:.5px;text-transform:uppercase;
  padding:5px 10px;cursor:pointer;
  transition:background .15s,box-shadow .15s;display:flex;align-items:center;gap:5px;
}
.icon-btn:hover{background:rgba(255,255,255,.13);color:#fff;box-shadow:0 0 12px rgba(255,255,255,.1);}

/* ── MODAL ── */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.72);
  z-index:400;display:flex;align-items:center;justify-content:center;
  animation:fadein .2s ease;
}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.modal-box{
  background:rgba(10,10,35,.97);
  border:2px solid rgba(255,45,120,.4);
  border-radius:18px;padding:28px 28px 24px;
  max-width:660px;width:90%;
  max-height:85vh;
  display:flex;flex-direction:column;
  box-shadow:0 0 60px rgba(255,45,120,.2);
  position:relative;
  animation:ov-in .25s cubic-bezier(.34,1.56,.64,1);
}
.modal-title{flex-shrink:0;
  font-family:'Bangers',cursive;font-size:2rem;letter-spacing:3px;
  color:#FFD700;margin-bottom:18px;filter:drop-shadow(0 0 8px rgba(255,215,0,.3));
}
.modal-body{font-size:.95rem;font-weight:600;color:rgba(255,255,255,.8);line-height:1.7;}
.modal-body ol{padding-left:18px;}
.modal-body li{margin-bottom:8px;}
.modal-close{
  position:absolute;top:14px;right:16px;
  background:none;border:none;color:rgba(255,255,255,.4);
  font-size:1.4rem;cursor:pointer;line-height:1;
}
.modal-close:hover{color:#fff;}




  .card{padding:14px 10px !important;}
  .btn-row{gap:4px !important;}
  .btn-submit{font-size:0.9rem !important;padding:10px 6px !important;}
  .btn-secondary{font-size:0.75rem !important;padding:9px 4px !important;}
  .answer-input{font-size:1rem !important;}
}


/* ── LETTER INPUT DISPLAY ── */
.answer-box{
  background:rgba(10,10,30,0.6);
  border:2px solid rgba(255,45,120,.45);
  border-radius:12px;
  padding:14px 12px;
  width:100%;cursor:text;
  display:flex;align-items:center;justify-content:center;
  min-height:64px;
  position:relative;
  margin-bottom:12px;
}
.letter-display{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.letter-cell{
  width:36px;height:42px;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;font-weight:900;font-family:'Nunito',sans-serif;
  transition:all .15s;
}
.letter-cell-empty{
  background:rgba(0,180,80,0.2);
  border:1.5px solid rgba(0,200,90,0.5);
  color:#FFD700;
}
.letter-cell-typed{
  background:rgba(30,30,60,0.9);
  border:1.5px solid rgba(255,255,255,0.25);
  color:#fff;
}
.letter-cell-hint{
  background:rgba(255,215,0,0.18);
  border:1.5px solid rgba(255,215,0,0.7);
  color:#FFD700;
}
.answer-input-hidden{
  position:absolute;opacity:0;width:1px;height:1px;
  border:none;outline:none;background:none;
  top:50%;left:50%;transform:translate(-50%,-50%);
}

    left:0 !important;
    right:0 !important;
    margin:0 auto !important;
    width:fit-content !important;
    transform:none !important;
    position:fixed !important;
  }
}

@media(min-width:1024px) and (orientation:landscape){
  .card{
    max-width:1400px !important;
    padding:28px 32px !important;
  }
  .words-grid{
    grid-template-columns:repeat(6,1fr) !important;

  }

  }

    font-size:1.3rem !important;
    padding:16px 0 !important;
  }

  }

    height:56px !important;
    font-size:1.6rem !important;
  }
  .speak-section button{
    font-size:1.2rem !important;
    padding:16px 40px !important;
  }
  #app-inner{
    padding:20px 40px 30px !important;
  }
}

<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

function Game() {
  const [phase,     setPhase]     = useState("setup");
  const [words,     setWords]     = useState(Array(20).fill(""));
  const [shuffled,  setShuffled]  = useState([]);
  const [idx,       setIdx]       = useState(0);
  const [answer,    setAnswer]    = useState("");
  const [tries,     setTries]     = useState(0);
  const [feedback,  setFeedback]  = useState(null);
  const [results,   setResults]   = useState([]);
  const [particles, setParticles] = useState([]);
  const [flash,     setFlash]     = useState(null);
  const [speaking,  setSpeaking]  = useState(false);
  const [toast,     setToast]     = useState(null);
  const inputRef = useRef(null);

  const JSONBIN_ID = "69fca31aadc21f119a68cfdb";
  const JSONBIN_KEY = "$2a$10$ZmohFEKQaFz/Ag31Eov7I.pYkzvW4GDsS1lXI0HcUG/Qv6sqOBVA.";
  const saveTimerRef = useRef(null);
  const isSaving = useRef(false);
  const loadedRef = useRef(false);

  const allSlotsRef = React.useRef({});

  const jbSave = (overrides={}) => {
    if(!loadedRef.current) return;
    clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(()=>{
      if(isSaving.current) return;
      isSaving.current = true;
      const slotKey = activeMode || 'mywords';
      const currentSlot = Object.assign({
        words: words.map(w=>w.trim()),
        phase, shuffled, wordIdx: idx, results, tries
      }, overrides);
      // Always save current slot AND preserve the other slot
      allSlotsRef.current[slotKey] = currentSlot;
      allSlotsRef.current.activeMode = slotKey;
      // Ensure both slots exist in payload
      if(!allSlotsRef.current['mywords']) allSlotsRef.current['mywords'] = {words:[],phase:"setup",shuffled:[],wordIdx:0,results:[],tries:0};
      if(!allSlotsRef.current['random']) allSlotsRef.current['random'] = {words:[],phase:"setup",shuffled:[],wordIdx:0,results:[],tries:0};
      const payload = Object.assign({}, allSlotsRef.current);
      console.log("Saving slot:", slotKey);
      fetch("https://api.jsonbin.io/v3/b/"+JSONBIN_ID,{
        method:"PUT",
        headers:{"Content-Type":"application/json","X-Master-Key":JSONBIN_KEY},
        body:JSON.stringify(payload)
      })
      .then(r=>r.json())
      .then(()=>{ isSaving.current=false; showToast("✓ Saved","success"); try{ localStorage.setItem('spellmaster_ivys_cache', JSON.stringify(payload)); }catch(e){} })
      .catch(()=>{ isSaving.current=false; });
    },800);
  };

  const applySlot = (slot) => {
    if(!slot) return;
    if(slot.words && Array.isArray(slot.words)){
      const filled = [...slot.words,...Array(Math.max(0,20-slot.words.length)).fill("")].slice(0,20);
      setWords(filled);
    }
    if(slot.results && slot.results.length>0) setResults(slot.results);
    else setResults([]);
    if(slot.phase==="game" && slot.shuffled && slot.shuffled.length>0){
      setShuffled(slot.shuffled);
      setIdx(slot.wordIdx||0);
      setTries(slot.tries||0);
      setResumeData({shuffled:slot.shuffled,wordIdx:slot.wordIdx||0,tries:slot.tries||0,results:slot.results||[]});
    } else {
      setPhase("setup"); setShuffled([]); setIdx(0); setTries(0); setResumeData(null);
    }
  };

  const switchMode = (newMode) => {
    // Save current slot
    const curKey = activeMode || 'mywords';
    allSlotsRef.current[curKey] = {
      words: words.map(w=>w.trim()), phase, shuffled, wordIdx: idx, results, tries
    };
    // Load new slot if it exists
    const newSlot = allSlotsRef.current[newMode];
    setActiveMode(newMode);
    if(newSlot && newSlot.words && newSlot.words.filter(w=>w).length>0){
      applySlot(newSlot);
      allSlotsRef.current.activeMode = newMode;
      setTimeout(()=>jbSave({}), 300);
    } else {
      setResults([]); setShuffled([]); setIdx(0); setTries(0); setPhase("setup"); setResumeData(null);
      allSlotsRef.current.activeMode = newMode;
      if(newMode==='random') randomFill();
      else { setWords(Array(20).fill('')); setTimeout(()=>jbSave({}), 300); }
    }
  };

  const jbLoad = () => {
    // ── Step 1: Load from localStorage instantly ──
    try {
      const cached = localStorage.getItem('spellmaster_ivys_cache');
      if(cached){
        const rec = JSON.parse(cached);
        allSlotsRef.current = rec;
        const savedMode = rec.activeMode || 'mywords';
        setActiveMode(savedMode);
        const slot = rec[savedMode];
        if(slot) applySlot(slot);
        setIsLoading(false);
        console.log("Loaded from cache instantly");
      }
    } catch(e){ console.log("No cache"); }

    // ── Step 2: Sync with JSONbin in background ──
    fetch("https://api.jsonbin.io/v3/b/"+JSONBIN_ID+"/latest",{
      headers:{"X-Master-Key":JSONBIN_KEY}
    })
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(data=>{
      const rec = data.record || data;
      console.log("Synced from JSONbin");
      allSlotsRef.current = rec;
      // Save to localStorage for next time
      try{ localStorage.setItem('spellmaster_ivys_cache', JSON.stringify(rec)); }catch(e){}
      const savedMode = rec.activeMode || 'mywords';
      setActiveMode(savedMode);
      const slot = rec[savedMode];
      if(slot) applySlot(slot);
    })
    .catch(e=>console.log("JSONbin sync failed, using cache"))
    .finally(()=>{ loadedRef.current=true; setIsLoading(false); });
  }

  // Load once on mount
  useEffect(()=>{ jbLoad(); },[]);








  const [hints,         setHints]        = useState(0);
  const [hintedPos,     setHintedPos]    = useState([]);
  const [totalHints,    setTotalHints]   = useState(0);
  const [selectedGrade, setSelectedGrade]= useState(null);
  const [resumeData,     setResumeData]    = useState(null);
  const [countdown,     setCountdown]    = useState(null);
  const countdownRef = useRef(null);
  const [modal, setModal] = useState(null);
  const [isLoading, setIsLoading] = useState(true);
  const [activeMode, setActiveMode] = useState(null); // 'mywords' | 'random' | null




  const grade6Pool = ["able", "add", "after", "again", "age", "ago", "ahead", "air", "all", "allow", "also", "always", "animal", "answer", "any", "apple", "ask", "away", "baby", "back", "ball", "band", "bear", "because", "been", "before", "begin", "being", "below", "best", "bird", "birthday", "black", "blue", "boat", "body", "book", "born", "both", "bought", "box", "boy", "bring", "brother", "build", "busy", "buy", "cake", "call", "came", "can", "care", "carry", "cat", "chair", "change", "check", "child", "city", "class", "clean", "clear", "close", "cloud", "cold", "color", "come", "cook", "cool", "copy", "cost", "could", "count", "cover", "cry", "cup", "cut", "dark", "day", "dear", "deep", "did", "different", "dinner", "does", "done", "door", "down", "draw", "dream", "drink", "drive", "drop", "dry", "duck", "during", "each", "earn", "easy", "eight", "else", "end", "enjoy", "enough", "even", "every", "except", "exit", "face", "fall", "family", "far", "farm", "fast", "feel", "feet", "fill", "find", "fine", "fish", "five", "fix", "flew", "flip", "fly", "fond", "food", "forest", "forget", "found", "four", "fox", "free", "friend", "from", "front", "full", "fun", "funny", "gave", "gift", "girl", "give", "glad", "glam", "going", "gone", "good", "got", "grab", "great", "green", "grew", "grow", "guess", "had", "half", "hand", "happy", "hard", "has", "have", "head", "hear", "help", "here", "hide", "high", "hill", "hint", "hold", "home", "hope", "house", "how", "huge", "hump", "hunt", "idea", "into", "jab", "jack", "jar", "jot", "jump", "just", "keep", "kind", "king", "know", "lab", "lake", "land", "large", "last", "late", "lead", "leaf", "learn", "left", "let", "light", "like", "list", "little", "live", "long", "look", "love", "low", "made", "main", "make", "many", "map", "may", "mean", "meet", "mix", "mom", "more", "most", "move", "much", "must", "name", "need", "nest", "new", "next", "nice", "night", "nine", "now", "often", "old", "once", "open", "other", "our", "out", "own", "page", "park", "part", "past", "pick", "place", "plan", "play", "point", "pond", "pool", "print", "pull", "push", "put", "quiz", "race", "rain", "raise", "ran", "read", "real", "red", "rest", "rice", "rich", "ride", "right", "road", "rock", "room", "rope", "rose", "round", "rule", "run", "said", "same", "sand", "save", "saw", "say", "school", "seed", "seen", "send", "set", "seven", "show", "side", "since", "sing", "size", "skip", "sleep", "slow", "small", "smell", "smile", "snow", "soft", "some", "song", "soon", "speak", "spot", "star", "stay", "step", "still", "stop", "storm", "story", "straw", "strong", "such", "summer", "sun", "sure", "swim", "take", "talk", "than", "that", "them", "then", "there", "they", "thin", "thing", "think", "those", "time", "tiny", "told", "too", "took", "top", "try", "turn", "two", "under", "until", "upon", "use", "very", "vine", "wait", "walk", "want", "warm", "was", "wash", "watch", "water", "way", "were", "west", "when", "which", "while", "white", "who", "why", "will", "wind", "wish", "with", "word", "work", "world", "would", "write", "yard", "year", "yes", "yet", "you", "your", "zebra", "zone"];

  function randomFill() {
    const pool = [...grade6Pool];
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    const newWords = pool.slice(0,20);
    setWords(newWords);
    // Explicitly save into 'random' slot regardless of activeMode state timing
    setTimeout(()=>{
      allSlotsRef.current['random'] = {words:newWords, phase:"setup", shuffled:[], wordIdx:0, results:[], tries:0};
      allSlotsRef.current.activeMode = 'random';
      if(!allSlotsRef.current['mywords']) allSlotsRef.current['mywords'] = {words:[], phase:"setup", shuffled:[], wordIdx:0, results:[], tries:0};
      const payload = Object.assign({}, allSlotsRef.current);
      fetch("https://api.jsonbin.io/v3/b/"+JSONBIN_ID,{
        method:"PUT",
        headers:{"Content-Type":"application/json","X-Master-Key":JSONBIN_KEY},
        body:JSON.stringify(payload)
      }).catch(()=>{});
    },200);
  }
  const refocus = () => setTimeout(()=>{ if(inputRef.current){ inputRef.current.focus(); inputRef.current.click(); } },50);

  function useHint() {
    const word = shuffled[idx];
    if(!word||hints>=2) return;
    const newHints=hints+1;
    setHints(newHints);
    setTotalHints(t=>t+1);
    // Find next untyped position to hint
    let hintPos = -1;
    for(let i=0;i<word.length;i++){
      if(!answer[i] && !hintedPos.includes(i)){ hintPos=i; break; }
    }
    if(hintPos>=0) setHintedPos(p=>[...p,hintPos]);
    setTimeout(()=>{ if(inputRef.current) inputRef.current.focus(); },10);
  }
 // null | 'about' | 'howto'

  const showToast = (msg, type="success") => {
    setToast({msg,type});
    setTimeout(()=>setToast(null), 2800);
  };

  const speak = useCallback((word) => {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.rate=0.8; u.pitch=1.1;

    // Pick a female voice — try common female names first, fall back gracefully
    const voices = window.speechSynthesis.getVoices();
    const femaleVoice = voices.find(v =>
      /female|woman|girl|zira|susan|samantha|victoria|karen|moira|fiona|tessa|veena|allison|ava|nicky/i.test(v.name)
    ) || voices.find(v =>
      v.name.toLowerCase().includes('en') && v.lang.startsWith('en') && v.name.match(/\bf\b|[^a-z]f[^a-z]/i)
    ) || voices.find(v => v.lang.startsWith('en'));

    if(femaleVoice) u.voice = femaleVoice;
    u.onstart=()=>setSpeaking(true);
    u.onend=()=>setSpeaking(false);
    window.speechSynthesis.speak(u);
  },[]);

  const doFlash = c => { setFlash(c); setTimeout(()=>setFlash(null),350); };

  const triggerBgGlow = (type) => {
    const el = document.getElementById('bg-glow');
    if(!el) return;
    el.className = '';
    void el.offsetWidth; // force reflow to restart animation
    el.className = 'glow-' + type;
    setTimeout(()=>{ el.className=''; }, 2000);
  };

  const burst = () => {
    const C=["#FFD700","#FF2D78","#00F5FF","#FF6B00","#fff","#9B59B6"];
    setParticles(Array.from({length:28},(_,i)=>({
      id:Date.now()+i,
      tx:(Math.random()-.5)*340, ty:(Math.random()-.5)*280,
      s:7+Math.random()*11, c:C[i%C.length],
      dur:(0.8+Math.random()*.5).toFixed(2)+"s"
    })));
    setTimeout(()=>setParticles([]),1400);
  };

  const startGame = () => {
    const valid = words.map(w=>w.trim()).filter(Boolean);
    if(!valid.length) return;
    const s=[...valid].sort(()=>Math.random()-.5);
    setShuffled(s); setIdx(0); setTries(0); setResults([]); setTotalHints(0); setHints(0);
    setAnswer(""); setHintedPos([]); setFeedback(null); setPhase("game");
  };

  const advance = (sArr, i) => {
    const next = i+1;
    if(next >= sArr.length){ setPhase("results"); setFeedback(null); jbSave({phase:"results"}); }
    else {
      setIdx(next); setTries(0); setAnswer(""); setHints(0); setHintedPos([]); setFeedback(null);
      setFeedback(null); setTimeout(()=>inputRef.current?.focus(), 100);
    }
  };

  const skipWord = () => {
    if(feedback) return;
    window.speechSynthesis.cancel();
    // Move current word to end of the queue
    const skipped = shuffled[idx];
    const newShuffled = [...shuffled.slice(0, idx), ...shuffled.slice(idx + 1), skipped];
    setShuffled(newShuffled);
    setTries(0); setAnswer(""); setHints(0); setHintedPos([]);
    // If we just moved the last remaining word to the end, idx stays valid
    if(idx >= newShuffled.length - 1 && newShuffled.length > 1){
      setIdx(newShuffled.length - 2 < 0 ? 0 : idx);
    }
    setTimeout(()=>inputRef.current?.focus(), 100);
  };

  const submit = () => {
    if(!answer.trim()||feedback) return;
    const word = shuffled[idx];
    // Build full answer merging typed + hinted letters
    const fullAnswer = Array.from(word).map((letter,i)=>{
      if(hintedPos.includes(i)) return letter;
      return answer[i]||'';
    }).join('');
    // Normalize apostrophes/smart quotes before comparing
    const normalize = s => s.toLowerCase()
      .replace(/[‘’ʼ`´]/g, "'")  // smart quotes → straight
      .replace(/[“”]/g, '"')  // smart double quotes
      .trim();
    const ok = normalize(fullAnswer) === normalize(word);
    if(ok) {
      doFlash("gold"); burst(); triggerBgGlow("correct");
      setFeedback("correct");
      setResults(r=>[...r,{word,ok:true}]);
      setCountdown(3);
      let c=3; countdownRef.current=setInterval(()=>{ c--; if(c<=0){clearInterval(countdownRef.current);setCountdown(null);}else{setCountdown(c);} },1000);
      setTimeout(()=>advance(shuffled,idx), 3000);
    } else if(tries===0) {
      setFeedback("try"); setTries(1);
      setTimeout(()=>{ setFeedback(null); setAnswer(""); setTimeout(()=>{ if(inputRef.current){ inputRef.current.focus(); inputRef.current.click(); } },50); },3000);
    } else {
      doFlash("red"); triggerBgGlow("wrong");
      setFeedback("wrong");
      setResults(r=>{ const nr=[...r,{word,ok:false}]; setTimeout(()=>jbSave({results:nr,wordIdx:idx}),200); return nr; });
      setCountdown(5);
      let cw=5; countdownRef.current=setInterval(()=>{ cw--; if(cw<=0){clearInterval(countdownRef.current);setCountdown(null);}else{setCountdown(cw);} },1000);
      setTimeout(()=>advance(shuffled,idx), 5000);
    }
  };

  const playAgain = () => {
    const s=[...shuffled].sort(()=>Math.random()-.5);
    setShuffled(s); setIdx(0); setTries(0); setResults([]); setTotalHints(0); setHints(0);
    setAnswer(""); setHintedPos([]); setFeedback(null); setPhase("game");
  };

  const score = results.filter(r=>r.ok).length;
  const total = shuffled.length||1;
  const pct   = Math.round((score/total)*100);

  useEffect(()=>{
    // Pre-load voices so they're ready on first button press
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  },[]);

  return (
    <div id="app-inner" style={{position:"relative",zIndex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-start",minHeight:"100vh",padding:"12px 20px 18px"}}>

      {isLoading && !allSlotsRef.current.activeMode && (
        <div style={{position:'fixed',inset:0,zIndex:50,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(7,7,26,0.85)'}}>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:'2rem',marginBottom:'12px',animation:'spin 1s linear infinite',display:'inline-block'}}>⚡</div>
            <div style={{fontFamily:"'Bangers',cursive",fontSize:'1.2rem',letterSpacing:'4px',color:'rgba(255,255,255,0.6)'}}>LOADING YOUR WORDS...</div>
          </div>
        </div>
      )}
      {flash && <div className={"flash flash-"+flash} key={flash+Date.now()}/>}
      {toast && <div className={"toast toast-"+toast.type}>{toast.msg}</div>}
      {particles.map(p=>(
        <div key={p.id} className="particle" style={{width:p.s,height:p.s,background:p.c,boxShadow:"0 0 8px "+p.c,"--tx":p.tx+"px","--ty":p.ty+"px","--dur":p.dur}}/>
      ))}

      {/* ══ SETUP ══ */}
      {phase==="setup" && (
        <div className="card" style={{maxHeight:"calc(100vh - 50px)",overflowY:"auto",marginBottom:"24px"}}>
          <div style={{display:'flex',gap:'8px',justifyContent:'center',marginBottom:'10px'}}>
            <button
              onClick={()=>{
                const curKey = activeMode || 'mywords';
                allSlotsRef.current[curKey] = {words:words.map(w=>w.trim()),phase,shuffled,wordIdx:idx,results,tries};
                setActiveMode('mywords');
                const saved = allSlotsRef.current['mywords'];
                console.log("MY WORDS clicked, slot:", saved, "allSlots keys:", Object.keys(allSlotsRef.current));
                if(saved && saved.words && saved.words.filter(w=>w).length>0){
                  applySlot(saved);
                } else {
                  setWords(Array(20).fill('')); setResults([]); setShuffled([]); setIdx(0); setTries(0); setPhase('setup'); setResumeData(null);
                }
                allSlotsRef.current.activeMode = 'mywords';
                setTimeout(()=>jbSave({}),300);
              }}
              onMouseOver={e=>{if(activeMode!=='mywords'){e.currentTarget.style.background='linear-gradient(135deg,rgba(255,45,120,0.3),rgba(191,95,255,0.3)';}}}
              onMouseOut={e=>{if(activeMode!=='mywords'){e.currentTarget.style.background='linear-gradient(135deg,rgba(255,45,120,0.15),rgba(191,95,255,0.15))';}}}
              style={{
                background: activeMode==='mywords' ? 'rgba(0,200,80,0.2)' : 'linear-gradient(135deg,rgba(255,45,120,0.15),rgba(191,95,255,0.15))',
                border: activeMode==='mywords' ? '1.5px solid rgba(0,230,118,0.7)' : '1px solid rgba(255,45,120,0.4)',
                boxShadow: activeMode==='mywords' ? '0 0 10px rgba(0,200,80,0.25)' : 'none',
                borderRadius:'20px',padding:'6px 20px',color:'#fff',fontWeight:700,fontSize:'0.85rem',letterSpacing:'2px',cursor:'pointer',transition:'all .2s'
              }}>
              {activeMode==='mywords' ? '✓ ' : '✏️ '}MY WORDS
            </button>
            <button
              onClick={()=>{
                // If already on random tab - confirm before generating new words
                if(activeMode==='random'){
                  if(!window.confirm('Replace all words with new random words?')) return;
                  randomFill();
                  return;
                }
                // Switching FROM another tab - save current slot, load random slot
                const curKey = activeMode || 'mywords';
                allSlotsRef.current[curKey] = {words:words.map(w=>w.trim()),phase,shuffled,wordIdx:idx,results,tries};
                setActiveMode('random');
                const savedRandom = allSlotsRef.current['random'];
                if(savedRandom && savedRandom.words && savedRandom.words.filter(w=>w).length>0){
                  applySlot(savedRandom);
                  allSlotsRef.current.activeMode = 'random';
                  setTimeout(()=>jbSave({}),300);
                } else {
                  allSlotsRef.current.activeMode = 'random';
                  randomFill();
                }
              }}
              onMouseOver={e=>{if(activeMode!=='random'){e.currentTarget.style.background='linear-gradient(135deg,rgba(255,45,120,0.3),rgba(191,95,255,0.3)';}}}
              onMouseOut={e=>{if(activeMode!=='random'){e.currentTarget.style.background='linear-gradient(135deg,rgba(255,45,120,0.15),rgba(191,95,255,0.15))';}}}
              style={{
                background: activeMode==='random' ? 'rgba(0,200,80,0.2)' : 'linear-gradient(135deg,rgba(255,45,120,0.15),rgba(191,95,255,0.15))',
                border: activeMode==='random' ? '1.5px solid rgba(0,230,118,0.7)' : '1px solid rgba(255,45,120,0.4)',
                boxShadow: activeMode==='random' ? '0 0 10px rgba(0,200,80,0.25)' : 'none',
                borderRadius:'20px',padding:'6px 20px',color:'#fff',fontWeight:700,fontSize:'0.85rem',letterSpacing:'2px',cursor:'pointer',transition:'all .2s'
              }}>
              {activeMode==='random' ? '✓ ' : '🎲 '}RANDOM WORDS
            </button>
          </div>

          <div style={{textAlign:'center',marginBottom:'8px'}}>
            <button onClick={()=>jbSave({})}
              onMouseOver={e=>{e.currentTarget.style.background='linear-gradient(135deg,rgba(0,200,255,0.35),rgba(0,100,200,0.35))';}}
              onMouseOut={e=>{e.currentTarget.style.background='linear-gradient(135deg,rgba(0,200,255,0.15),rgba(0,100,200,0.15))';}}
              style={{background:'linear-gradient(135deg,rgba(0,200,255,0.15),rgba(0,100,200,0.15))',border:'1px solid rgba(0,200,255,0.5)',borderRadius:'20px',padding:'5px 20px',color:'#00C8FF',fontWeight:700,fontSize:'0.75rem',letterSpacing:'2px',cursor:'pointer',transition:'all .2s'}}>
              💾 SAVE
            </button>
          </div>
          <div style={{textAlign:'center',marginBottom:'8px'}}>
            <button onClick={()=>{
                const slot = allSlotsRef.current[activeMode||'mywords'];
                if(slot && slot.words && slot.words.filter(w=>w).length>0){
                  applySlot(slot);
                } else {
                  showToast('No saved game found','error');
                }
              }}
              onMouseOver={e=>{e.currentTarget.style.background='rgba(255,215,0,0.3)';}}
              onMouseOut={e=>{e.currentTarget.style.background='rgba(255,215,0,0.12)';}}
              style={{background:'rgba(255,215,0,0.12)',border:'1px solid rgba(255,215,0,0.5)',borderRadius:'20px',padding:'5px 20px',color:'#FFD700',fontWeight:700,fontSize:'0.75rem',letterSpacing:'2px',cursor:'pointer',transition:'all .2s'}}>
              📂 LOAD LAST GAME
            </button>
          </div>
          {results.length>0&&totalHints>0&&(
            <div style={{textAlign:"center",marginBottom:"8px",fontSize:".72rem",fontWeight:800,letterSpacing:"1.5px",color:"rgba(255,215,0,0.6)",textTransform:"uppercase"}}>
              💡 {totalHints} hint{totalHints===1?"":"s"} used
            </div>
          )}
                    <div className="words-grid">
            {Array(20).fill(0).map((_,i)=>{
              const w = words[i].trim().toLowerCase();
              const result = results.find(r => r.word.toLowerCase() === w);
              const highlight = result
                ? result.ok
                  ? {borderColor:"#00CC66",background:"rgba(0,160,70,.35)",color:"#AAFFCC",fontWeight:900}
                  : {borderColor:"#CC2222",background:"rgba(160,20,20,.45)",color:"#FFAAAA",fontWeight:900}
                : {};
              return (
                <div key={i} className="word-wrap">
                  <span className="word-num">{i+1}</span>
                  <input className="word-input" placeholder={"word "+(i+1)} value={words[i]}
                    style={highlight}
                    onChange={e=>{ const u=[...words]; u[i]=e.target.value; setWords(u);
                      // Explicitly save to mywords slot when typing
                      const slotKey = activeMode || 'mywords';
                      allSlotsRef.current[slotKey] = Object.assign(allSlotsRef.current[slotKey]||{}, {words:u.map(w=>w.trim())});
                      allSlotsRef.current.activeMode = slotKey;
                      jbSave({words:u.map(w=>w.trim())});
                    }}
                    onKeyDown={e=>{
                      if(e.key==="Enter"){
                        const all=document.querySelectorAll(".word-input");
                        if(all[i+1]) all[i+1].focus(); else startGame();
                      }
                    }}
                  />
                </div>
              );
            })}
          </div>

          {/* Clear all words */}
          <div style={{textAlign:"center",marginBottom:"10px"}}>
            <button className="btn btn-secondary" style={{fontSize:"0.85rem",padding:"7px 20px"}}
              onClick={()=>{ if(!window.confirm('Clear all words? This cannot be undone.')) return; setWords(Array(20).fill("")); setResults([]); setTotalHints(0); setHints(0); setSelectedGrade(null); setHintedPos([]); }}>
              ✕ Clear All Words
            </button>
          </div>

          <button className="btn btn-start" onClick={startGame}><span>✨</span><span>LET'S SPELL!</span><span>✨</span></button>

          {results.length > 0 && (
            <>
              <div style={{display:"flex",gap:"10px",marginTop:"12px",position:"relative",zIndex:1,justifyContent:"center"}}>
                <button className="btn" style={{
                  fontSize:"1.1rem",padding:"12px 20px",
                  background:"linear-gradient(135deg,rgba(200,40,40,.25),rgba(180,20,20,.35))",
                  border:"1.5px solid rgba(200,60,60,.55)",color:"#FF7777",
                  boxShadow:"0 0 12px rgba(200,40,40,.15)"
                }} onClick={()=>{
                  const wrongWords = results.filter(r=>!r.ok).map(r=>r.word);
                  if(!wrongWords.length) return;
                  const s=[...wrongWords].sort(()=>Math.random()-.5);
                  setShuffled(s); setIdx(0); setTries(0); setResults([]); setTotalHints(0); setHints(0); setSelectedGrade(null); setHintedPos([]);
                  setAnswer(""); setFeedback(null); setPhase("game");
                }}>
                  🔁 REDO WRONG WORDS
                </button>
                <button className="btn" style={{
                  fontSize:"1.1rem",padding:"12px 18px",
                  background:"rgba(255,255,255,.04)",
                  border:"1.5px solid rgba(255,255,255,.15)",color:"rgba(255,255,255,.4)",
                }} onClick={()=>setResults([])}>
                  ✕ Clear Results
                </button>
              </div>
              <div style={{display:"flex",gap:"18px",justifyContent:"center",marginTop:"12px",position:"relative",zIndex:1,alignItems:"center"}}>
                <span style={{display:"flex",alignItems:"center",gap:"6px",fontSize:".72rem",fontWeight:800,color:"rgba(0,255,136,.7)",letterSpacing:"1.5px"}}>
                  <span style={{width:"11px",height:"11px",borderRadius:"50%",background:"rgba(0,255,136,.7)",display:"inline-block",flexShrink:0}}></span>CORRECT {countdown!==null && <span style={{fontSize:'1.4rem',fontWeight:900,color:'#FFD700',marginLeft:'8px'}}>{countdown}</span>}
                </span>
                <span style={{display:"flex",alignItems:"center",gap:"6px",fontSize:".72rem",fontWeight:800,color:"rgba(200,80,80,.9)",letterSpacing:"1.5px"}}>
                  <span style={{width:"11px",height:"11px",borderRadius:"50%",background:"rgba(200,60,60,.8)",display:"inline-block",flexShrink:0}}></span>INCORRECT
                </span>
                <span style={{display:"flex",alignItems:"center",gap:"6px",fontSize:".72rem",fontWeight:800,color:"rgba(255,255,255,.3)",letterSpacing:"1.5px"}}>
                  <span style={{width:"11px",height:"11px",borderRadius:"50%",background:"rgba(8,8,30,.9)",border:"1.5px solid rgba(255,45,120,.5)",display:"inline-block",flexShrink:0}}></span>NOT ASKED
                </span>
              </div>
            </>
          )}

          {/* How to Play + About — small, at the bottom */}
          <div style={{display:"flex",gap:"10px",marginTop:"10px",position:"relative",zIndex:1}}>
            <button className="icon-btn" style={{flex:1,justifyContent:"center",padding:"6px 10px",fontSize:".75rem"}} onClick={()=>setModal('howto')}>❓ How to Play</button>
            <button className="icon-btn" style={{flex:1,justifyContent:"center",padding:"6px 10px",fontSize:".75rem"}} onClick={()=>setModal('about')}>ℹ️ About</button>
          </div>
        </div>
      )}

      {/* ══ GAME ══ */}
      {phase==="game" && (
        <div className="card" style={{marginBottom:"80px"}}>
          {feedback==="correct" && (
            <div className="overlay ov-correct">
              <div className="ov-big">✦ PERFECT! ✦</div>
              <div className="ov-sub">🌟 Incredible power! Keep it up! 🌟</div>
            </div>
          )}
          {feedback==="try" && (
            <div className="overlay ov-try">
              <div className="ov-big">⚠ TRY AGAIN!</div>
              <div className="ov-sub">One more chance — listen closely!</div>
            </div>
          )}
          {feedback==="wrong" && (
            <div className="overlay ov-wrong">
              <div className="ov-big">✗ Incorrect</div>
              <div className="ov-sub">The correct spelling was:</div>
              <div className="ov-reveal">{shuffled[idx]}</div>
              {countdown!==null && <div style={{fontSize:"2.5rem",fontWeight:900,color:"rgba(255,100,100,0.9)",marginTop:"8px"}}>{countdown}</div>}
              <div className="ov-sub" style={{marginTop:6,color:"rgba(200,80,80,.55)"}}>Keep practicing — you'll get it next time!</div>
            </div>
          )}

          <div className="stats-row">
            <div className="word-counter">WORD {idx+1} / {shuffled.length}</div>
            <div className="progress-bg">
              <div className="progress-fill" style={{width:((idx/shuffled.length)*100)+"%"}}/>
            </div>
            <div className="tries-row">
              <div className={"try-dot "+(tries===0?"on":"off")}/>
              <div className={"try-dot "+(tries===0?"on":"off")}/>
              <span className="try-label">{tries===0?"2 tries left":"last chance!"}</span>
            </div>
          </div>
          {totalHints>0&&(
            <div style={{textAlign:"right",fontSize:".65rem",fontWeight:800,letterSpacing:"1.5px",color:"rgba(255,215,0,0.65)",textTransform:"uppercase",marginBottom:"6px",position:"relative",zIndex:1}}>
              💡 {totalHints} hint{totalHints===1?"":"s"} used
            </div>
          )}
          <div className="speak-section">
            <div className="speak-hint">👂 Listen carefully, then spell the word!</div>
            <button className={"btn btn-speak "+(speaking?"pulsing":"")} onClick={()=>{ speak(shuffled[idx]); setTimeout(()=>{ if(inputRef.current) inputRef.current.focus(); },100); }}>
              {speaking?"🔊  LISTENING...":"🔊  HEAR THE WORD"}
            </button>
          </div>

          <div className="answer-box" onClick={()=>inputRef.current&&inputRef.current.focus()}>
            <div className="letter-display">
              {shuffled[idx] && Array.from(shuffled[idx]).map((letter,i)=>{
                const isHinted = hintedPos.includes(i);
                const typedChar = answer[i];
                if(isHinted) return <div key={i} className="letter-cell letter-cell-hint">{letter}</div>;
                if(typedChar) return <div key={i} className="letter-cell letter-cell-typed">{typedChar}</div>;
                return <div key={i} className="letter-cell letter-cell-empty">?</div>;
              })}
            </div>
            <input ref={inputRef} className="answer-input-hidden"
              value={answer} onChange={e=>setAnswer(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter") submit(); }}
              disabled={!!feedback} autoFocus
              autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false"
              data-form-type="other" inputMode="text"/>
          </div>

          <div className="btn-row">
            <button className="btn btn-submit" onClick={()=>{ submit(); refocus(); }} disabled={!!feedback}><span>⚡</span><span>SUBMIT</span></button>
            <button className="btn btn-secondary" style={{color:"#AAAAFF",borderColor:"rgba(150,150,255,.3)"}} onClick={()=>{ skipWord(); refocus(); }} disabled={!!feedback}>⏭ Skip</button>
            <button className="btn btn-secondary" onClick={()=>{ useHint(); refocus(); }} disabled={!!feedback||hints>=2} style={{color:hints>=2?"rgba(255,255,255,0.3)":"#FFD700",borderColor:hints>=2?"rgba(255,255,255,0.1)":"rgba(255,215,0,0.4)",cursor:hints>=2?"not-allowed":"pointer"}}>💡 Hint{hints>0?` (${hints}/2)`:""}</button>
            <button className="btn btn-secondary" style={{color:"#FF5555",borderColor:"rgba(255,85,85,.3)"}} onClick={()=>{ window.speechSynthesis.cancel(); setPhase("setup"); setFeedback(null); setAnswer(""); setHintedPos([]); }}>✖ Quit</button>
          </div>
        </div>
      )}

      {/* ══ RESULTS ══ */}
      {phase==="results" && (
        <div className="card">
          <div className="results-top">
            <div className="score-ring" style={{background:"conic-gradient(#00FF88 0deg,#00FF88 "+(pct*3.6)+"deg,rgba(255,255,255,.09) "+(pct*3.6)+"deg)"}}>
              <div className="score-num">{score}/{total}</div>
            </div>
            <div className="verdict-block">
              <div className="stars-row">{score===total?"🌟🌟🌟":score>=total*.8?"⭐⭐⭐":score>=total*.6?"⭐⭐":"⭐"}</div>
              <div className="verdict" style={{color:score===total?"#FFD700":score>=total*.8?"#00FF88":score>=total*.6?"#FF8C00":"#FF5555"}}>
                {score===total?"LEGENDARY! 🏆":score>=total*.8?"GREAT POWER! 💪":score>=total*.6?"KEEP TRAINING! 🔥":"MORE PRACTICE! ⚡"}
              </div>
            </div>
          </div>
          <div className="result-grid">
            {results.map((r,i)=>(
              <div key={i} className={"ri "+(r.ok?"ri-y":"ri-n")}>
                <span>{r.ok?"✅":"❌"}</span><span>{r.word}</span>
              </div>
            ))}
          </div>
          {totalHints>0&&(<div style={{textAlign:"center",margin:"10px 0",fontSize:"0.85rem",color:"rgba(255,215,0,0.8)",letterSpacing:"1px",fontWeight:700}}>💡 Hints used: {totalHints}</div>)}
          <div className="results-btns">
            <button className="btn btn-replay" onClick={playAgain}>⚡ TRAIN AGAIN!</button>
            <button className="btn btn-secondary" onClick={()=>setPhase("setup")}>🏠 Home</button>
          </div>
        </div>
      )}

      {/* ══ MODALS ══ */}
      {modal && (
        <div className="modal-backdrop" onClick={()=>setModal(null)}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <button className="modal-close" onClick={()=>setModal(null)}>✕</button>

            {modal==="about" && <>
              <div className="modal-title">ℹ️ About</div>
              <div className="modal-body">

<!-- setup_player-grade-badge -->
<script>
(function() {
  var GRADE = '3';
  var BADGE_CSS = ['position:absolute','top:-14px','right:-4px','display:inline-flex',
    'flex-direction:column','align-items:center','gap:1px',
    'pointer-events:none','z-index:2'].join(';');
  var LABEL_CSS = ['font-size:6px','font-weight:900','letter-spacing:1.5px',
    'color:#f5c518','font-family:Segoe UI,Arial,sans-serif',
    'text-transform:uppercase','line-height:1','display:block'].join(';');
  var CIRCLE_CSS = ['width:20px','height:20px','border-radius:50%',
    'background:#f5c518','color:#1a1a1a','font-size:11px','font-weight:900',
    'font-family:Segoe UI,Arial,sans-serif','display:flex',
    'align-items:center','justify-content:center',
    'border:2px solid rgba(0,0,0,0.2)',
    'box-shadow:0 2px 6px rgba(0,0,0,0.4)','line-height:1'].join(';');
  function inject() {
    var buttons = document.querySelectorAll('button');
    for (var i=0;i<buttons.length;i++) {
      var btn=buttons[i];
      if(!/random\s*words/i.test(btn.textContent)) continue;
      if(btn.querySelector('[data-grade-badge]')) continue;
      btn.style.position='relative'; btn.style.overflow='visible';
      var wrap=document.createElement('span');
      wrap.setAttribute('data-grade-badge','1');
      wrap.setAttribute('style',BADGE_CSS);
      var lbl=document.createElement('span');
      lbl.setAttribute('style',LABEL_CSS); lbl.textContent='GRADE';
      var circle=document.createElement('span');
      circle.setAttribute('style',CIRCLE_CSS); circle.textContent=GRADE;
      wrap.appendChild(lbl); wrap.appendChild(circle); btn.appendChild(wrap);
    }
  }
  inject();
  var attempts=0;
  var iv=setInterval(function(){ inject(); if(++attempts>30) clearInterval(iv); },300);
  var obs=new MutationObserver(inject);
  obs.observe(document.body,{childList:true,subtree:true});
  setTimeout(function(){ obs.disconnect(); },30000);
})();
</script>
<!-- end-setup_player-grade-badge -->
